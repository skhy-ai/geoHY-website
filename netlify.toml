[build]
  command = "npm run build"
  publish = "dist"
  # Set VITE_INVERSION_API_URL in Netlify Dashboard > Site > Environment Variables
  [build.environment]
    NODE_VERSION = "20"

# SPA routing: all paths fall back to index.html so react-router-dom works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache Vite-generated assets forever (filenames are content-hashed)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
